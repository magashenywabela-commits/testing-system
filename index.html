<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPARK auto · VRTS</title>
<style>
:root{--cr:#f8efe3;--pn:#fff;--ink:#111;--mut:#6b6b6b;--ln:#eadfce;--or:#d98200;--ord:#a9680a;--ot:#fdd9a0;--ol:#fff3df;--ok:#1f7a45;--okl:#e4f6ea;--bd:#c62828;--bl:#fde8e8;--wr:#a85d00;--wl:#ffe9c7}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--cr);color:var(--ink);font:15px/1.5 Inter,system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h2{margin:0;font-size:28px;letter-spacing:-.5px}h3{margin:0}
.sub{color:var(--mut);margin:2px 0 16px}.hint{font-size:13px;color:var(--mut)}
.btn{background:var(--or);color:#111;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;min-height:42px;transition:.15s}.btn:hover{background:var(--ord);color:#fff}
.btn.k{background:#000;color:#fff}.btn.s{background:var(--ol);color:#111;border:1px solid var(--ln)}.btn.d{background:#fff;color:var(--bd);border:1px solid #f0b4b4}.btn.sm{padding:4px 14px;min-height:32px;font-size:13px}
.btn:disabled{background:#f1e7d6;color:#b3a48c;cursor:not-allowed}
input,select,textarea{background:var(--cr);border:1.5px solid var(--ln);border-radius:16px;padding:11px 16px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px #d9820033}
label.l{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;color:#4a5560;text-transform:uppercase;margin:14px 0 6px}
.app{display:flex;min-height:100vh;padding:14px;gap:0}.side{width:236px;flex:none;background:#000;color:#bbb;border-radius:28px 0 0 28px;padding:22px 14px;display:flex;flex-direction:column}
.brand{padding:0 4px 22px}.brand img{width:100%;max-width:190px;display:block;border-radius:20px}.av{width:38px;height:38px;border-radius:50%;background:var(--or);color:#111;display:grid;place-items:center;font-weight:800;flex:none}
.side a{display:block;padding:12px 20px;border-radius:999px;cursor:pointer;margin-bottom:4px}.side a:hover{color:#fff}.side a.on{background:#fff;color:#000;font-weight:700}.side .ft{margin-top:auto;font-size:12px;padding:0 10px}
.main{flex:1;min-width:0;background:var(--pn);border-radius:0 28px 28px 0;padding:22px 30px;box-shadow:0 8px 30px #0001}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px;flex-wrap:wrap}.crumb{font-size:12px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
.who{display:flex;gap:10px;align-items:center;font-size:13px;text-align:right}.who .av{width:40px;height:40px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:22px;overflow:hidden;margin-bottom:16px}.cr{background:#f9f0e4;border-radius:22px;padding:20px;margin-bottom:16px}.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}th{background:#f9f0e4;text-align:left;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;color:#6b6b6b;padding:14px 18px;white-space:nowrap}td{padding:14px 18px;border-top:1px solid var(--ln)}.n{text-align:right}
tr.low td{background:#fffaf1}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}.s0{background:var(--wl);color:var(--wr)}.s1{background:#000;color:#fff}.s2{background:var(--okl);color:var(--ok)}.sk{background:var(--bl);color:var(--bd)}
.ban{display:flex;gap:14px;align-items:center;border-radius:999px;padding:12px 20px;margin-bottom:16px;font-weight:500}.ban i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.b-o{background:var(--okl);border:1px solid #b9e6c9}.b-o i{background:#22b862}.b-e{background:var(--bl);border:1px solid #f4c3c3;color:var(--bd)}.b-e i{background:#ef4444}.b-w{background:var(--wl);border:1px solid #f3d29b;color:var(--wr)}.b-w i{background:var(--or)}.b-i{background:var(--ol);border:1px solid var(--ln)}.b-i i{background:#555}.ban small{margin-left:auto;color:var(--mut);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.chip{border:0;background:var(--ol);border:1px solid var(--ln);border-radius:999px;padding:8px 18px;cursor:pointer}.chip.on{background:#000;color:#fff}.chips input{width:210px;margin-left:auto;border-radius:999px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dark{background:#000;color:#fff;border-radius:22px;padding:24px}.dark small{letter-spacing:1.4px;text-transform:uppercase;color:#aaa}.dark b{display:block;font-size:32px;margin:6px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.lc{background:#fff;border-radius:32px;padding:34px;width:400px;max-width:100%;box-shadow:0 12px 40px #0002}
.pwf{position:relative}.pwf button{position:absolute;right:16px;top:50%;transform:translateY(-50%);border:0;background:0;font-weight:800;font-size:12px;cursor:pointer}
.seg{display:flex;flex-direction:column;gap:8px;max-width:420px}.seg button{border:0;background:#e6e6e6;border-radius:999px;padding:11px;cursor:pointer;font-size:15px}.seg button.on{background:var(--ot);font-weight:700}.seg button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:16px;border-radius:99px;background:var(--ot);overflow:hidden;max-width:420px}.bar div{height:100%;background:var(--or);border-radius:99px;transition:.3s}
.ck{display:block;max-width:420px;border-radius:999px;background:#e6e6e6;padding:11px 20px;margin-bottom:8px;cursor:pointer;text-align:center;border:0;width:100%;font-size:15px}.ck.on{background:#65d6a1}
.jc{border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer}.jc:hover{border-color:var(--or)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}#modal>div{background:#fff;border-radius:28px;padding:26px;width:680px;max-width:100%;max-height:94vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:13px 22px;margin-bottom:8px;cursor:pointer}.opt.on{background:#000;color:#fff;border-color:#000}.opt.off{color:#aaa;background:#fbf7f0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9;width:560px;max-width:92vw}
@media(max-width:820px){.app{flex-direction:column;padding:0}.side{width:100%;border-radius:0;flex-direction:row;overflow-x:auto;padding:10px;align-items:center;gap:4px}.side .brand{padding:0 10px 0 4px;flex:none}.brand img{width:70px;border-radius:14px}.side a{white-space:nowrap;margin:0}.side .ft{display:none}.main{border-radius:0;padding:16px}.two{grid-template-columns:1fr}.who span{display:none}.chips input{margin:0;width:100%}th,td{padding:10px}}
@media print{.side,.noprint,.top{display:none!important}#modal{position:static;background:none;display:block}.app{padding:0}}
</style></head><body>
<div id="app"></div><div id="modal" role="dialog" aria-modal="true"></div><div id="toast" aria-live="polite"></div>

 return`<table><tr><th>Job ID</th><th>Customer</th><th>Vehicle</th><th>Status</th><th>Mechanic</th><th></th></tr>${L.map(j=>`<tr><td><b>${j.id}</b></td><td>${esc(j.cust)}</td><td>${esc(j.mk)}<br><span class="hint">${esc(j.reg)}</span></td><td>${pill(j)}</td><td>${j.mech?`<b>${esc(mn(j.mech))}</b>`:'<span style="color:#aaa">Unassigned</span>'}${m?` <a href="#" style="color:var(--ord);font-weight:700;font-size:13px" onclick="event.preventDefault();assignF('${j.id}')">${j.mech?"Change":"Assign"}</a>`:""}</td><td style="white-space:nowrap"><button class="btn sm k" onclick="detail('${j.id}')">Open</button> <button class="btn sm s" onclick="jobForm('${j.id}')">Edit</button> <button class="btn sm d" onclick="delJ('${j.id}')">Delete</button></td></tr>`).join("")}</table>`}
function assignF(id,sel){const j=J(id),ms=mechs(),rec=[...ms].filter(m=>act(m.u)<3).sort((a,b)=>act(a.u)-act(b.u))[0];sel=sel||j.mech||(rec&&rec.u);
 modal(`<h3>Assign Mechanic</h3><p class="hint" style="text-transform:uppercase;letter-spacing:.8px">Job ${id} · ${esc(j.mk)} · ${esc(j.desc)}</p>${ms.map(m=>{const a=act(m.u),busy=a>=3;return`<button class="opt ${sel==m.u?"on":busy?"off":""}" onclick="assignF('${id}','${m.u}')">${esc(m.n)} (${a} active${a==1?"":" jobs"})${rec&&rec.u==m.u?" · Recommended":""}${busy?" · Busy":""}${sel==m.u?'<b style="float:right">✓</b>':""}</button>`}).join("")}<div class="row" style="display:flex;gap:10px;margin-top:14px"><button class="btn k" style="flex:1" onclick="doAssign('${id}','${sel||""}')">Confirm Assignment</button><button class="btn s" onclick="modal()">Cancel</button></div>`)}
function doAssign(id,u){if(!u){toast("Please pick a mechanic first.","e");return}J(id).mech=u;save();modal();msg=`Done. ${mn(u)} assigned to ${id}.`;view()}
function jobForm(id){const j=J(id)||{cust:"",ph:"",reg:"",mk:"",desc:""};
 modal(`<h3>${id?"Edit job "+id:"New job card"}</h3><p class="hint">Fields marked * are needed to save.</p><div id="ferr"></div><label class="l">Customer name *</label><input id="f1" value="${esc(j.cust)}"><label class="l">Phone number *</label><input id="f2" type="tel" value="${esc(j.ph)}" placeholder="082 555 0142"><label class="l">Vehicle registration *</label><input id="f3" value="${esc(j.reg)}" placeholder="CA 123 456"><label class="l">Make, model and year</label><input id="f4" value="${esc(j.mk)}"><label class="l">What needs fixing? *</label><textarea id="f5" rows="3">${esc(j.desc)}</textarea><div style="display:flex;gap:10px;margin-top:18px"><button class="btn" onclick="saveJ('${id||""}')">Save job</button><button class="btn s" onclick="modal()">Cancel</button></div>`)}
function saveJ(id){const v=[f1,f2,f3,f4,f5].map(x=>x.value.trim()),ms=[];if(!v[0])ms.push("the customer's name");if(!/^[0-9 +()-]{9,}$/.test(v[1]))ms.push("a phone number (at least 9 digits)");if(!v[2])ms.push("the registration");if(!v[4])ms.push("what needs fixing");
 if(ms.length){ferr.innerHTML=ban("Just need "+ms.join(", ")+" and we're good to go.","e");return}
 if(id){Object.assign(J(id),{cust:v[0],ph:v[1],reg:v[2],mk:v[3],desc:v[4]});msg=`Done. Changes to ${id} saved.`}else{const n="SJ-"+S.next++;S.jobs.unshift({id:n,cust:v[0],ph:v[1],reg:v[2],mk:v[3],desc:v[4],mech:"",st:0,hrs:0,parts:[],ck:[0,0,0,0,0]});msg=`Done. Job ${n} created. Next, pick a mechanic for it.`}save();modal();view()}
function delJ(id){modal(`<h3>Delete job ${id}?</h3><p>This removes the job and its history for good, so it can't be brought back.</p><div style="display:flex;gap:10px"><button class="btn d" onclick="doDel('${id}')">Yes, delete it</button><button class="btn k" onclick="modal()">Keep the job</button></div>`)}
function doDel(id){const j=J(id);j.parts.forEach(p=>P(p.pid).stock+=p.q);S.jobs=S.jobs.filter(x=>x!=j);save();modal();msg=`Job ${id} deleted. Its parts went back into stock.`;view()}
function mechV(){const L=S.jobs.filter(j=>j.mech==cur.u);return`<div style="max-width:560px"><h2>My jobs</h2><p class="sub">Hi ${esc(cur.n.split(" ")[0])} 👋 ${L.length} job${L.length==1?"":"s"} today</p>${L.map(j=>`<div class="jc" onclick="detail('${j.id}')"><b>${j.id}</b> · ${esc(j.reg)} <span style="float:right">${pill(j)}</span><br>${esc(j.cust)} · ${esc(j.desc)}<br><span class="hint">${j.ck.filter(Boolean).length} of 5 checks done</span></div>`).join("")||'<div class="cr">Nothing on your list right now. Grab a coffee ☕ the manager will assign your next job.</div>'}</div>`}
function detail(id){const j=J(id),n=j.ck.filter(Boolean).length,ok=ready(j),adm=cur.r!="mechanic";
 modal(`<div style="display:flex;justify-content:space-between;align-items:center"><div><h3>${id} · ${esc(j.reg)}</h3><span class="hint">${esc(j.cust)} · ${esc(j.ph)} · ${esc(j.mk)}</span></div><button class="btn sm s" onclick="modal();view()">Close</button></div><p><b>${esc(j.desc)}</b></p>
 <label class="l">Repair status</label><div class="seg">${ST.map((s,i)=>`<button class="${j.st==i?"on":""}" ${i==2&&!ok?"disabled":""} onclick="setSt('${id}',${i})">${s}</button>`).join("")}</div>
 <label class="l">Status check · ${n} of 5</label><div class="bar"><div style="width:${n*20}%"></div></div><p class="hint" style="margin:8px 0">${ok?"All done. This car is safe to release.":`${5-n} more to go before the car can be released. Tap each one as you finish.`}</p>${CHK.map((c,i)=>`<button class="ck ${j.ck[i]?"on":""}" onclick="tick('${id}',${i})">${j.ck[i]?"✓ ":""}${c}</button>`).join("")}
 <label class="l">Labour hours <span style="text-transform:none;font-weight:400">(rate ${R(S.rate)}/h)</span></label><input id="hrs" type="number" min="0" step="0.25" value="${j.hrs}" style="max-width:160px">
 <label class="l">Parts used</label>${j.parts.length?`<table>${j.parts.map((p,i)=>`<tr><td style="padding:8px 0">${esc(P(p.pid).name)} × ${p.q}</td><td class="n" style="padding:8px 0">${R(p.q*p.pr)}</td><td class="n" style="padding:8px 0"><a href="#" onclick="event.preventDefault();rmP('${id}',${i})">Remove</a></td></tr>`).join("")}</table>`:'<p class="hint">No parts added yet.</p>'}
 <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><select id="ps" style="flex:1;min-width:200px">${S.parts.map(p=>`<option value="${p.id}">${esc(p.name)} · ${R(p.price)} · ${p.stock} in stock</option>`).join("")}</select><input id="pq" type="number" min="1" value="1" style="width:84px" aria-label="Quantity"><button class="btn s" onclick="addP('${id}')">Add</button></div><div id="perr"></div>
 <p style="margin:16px 0 0">Parts ${R(pc(j))} + Labour ${R(lc(j))} = <b>${R(tc(j))}</b></p>
 <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn" onclick="saveH('${id}')">Save progress</button><button class="btn k" ${ok&&j.st!=2?"":"disabled"} onclick="setSt('${id}',2)">Ready for collection</button>${adm?`<button class="btn s" ${ok?"":"disabled"} onclick="invoice('${id}')">View invoice</button>`:""}</div>`)}
function setSt(id,i){const j=J(id);if(i==2&&!ready(j)){toast("Almost! Finish all 5 safety checks first, then you can release this car.","e");return}j.st=i;save();toast(`Status updated to ${ST[i]}.`);detail(id)}
function tick(id,i){const j=J(id);j.ck[i]=j.ck[i]?0:1;if(!ready(j)&&j.st==2)j.st=1;save();detail(id)}
function saveH(id){const v=parseFloat(hrs.value);if(isNaN(v)||v<0||v>100){toast("Please enter labour hours as a number, like 1.5.","e");return}J(id).hrs=v;save();toast("Progress saved. Nice work!");detail(id)}
function addP(id){const j=J(id),p=P(ps.value),n=parseInt(pq.value);if(!n||n<1){perr.innerHTML=ban("Please enter a quantity of 1 or more.","e");return}
 if(n>p.stock){perr.innerHTML=ban(`We only have ${p.stock} of ${esc(p.name)} left. Add ${p.stock} or fewer, or set the job to Awaiting Parts.`,"e");return}
 p.stock-=n;const l=j.parts.find(x=>x.pid==p.id);l?l.q+=n:j.parts.push({pid:p.id,q:n,pr:p.price});save();toast(low(p)?`Added. Heads up: only ${p.stock} left, time to reorder.`:"Part added to the job.",low(p)?"w":"o");detail(id)}
function rmP(id,i){const j=J(id),l=j.parts[i];P(l.pid).stock+=l.q;j.parts.splice(i,1);save();toast("Removed, and the part is back in stock.");detail(id)}
function partsV(){const cats=["All Parts",...new Set(S.parts.map(p=>p.cat))],L=S.parts.filter(p=>(pf=="All Parts"||p.cat==pf)&&(!pq||(p.sku+p.name).toLowerCase().includes(pq.toLowerCase()))),lw=S.parts.filter(low),val=S.parts.reduce((a,p)=>a+p.price*p.stock,0),w=lw.sort((a,b)=>a.stock-b.stock)[0];
 return`<div class="head"><div><h2>Spare Parts Inventory</h2><p class="sub">Track stock, cost and low-stock alerts</p></div><div style="display:flex;gap:10px;flex-wrap:wrap">${lw.length?`<span class="btn s" style="cursor:default">⚠ ${lw.length} Low Stock</span>`:""}<button class="btn" onclick="partForm()">+ Add Part</button></div></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${pf==c?"on":""}" onclick="pf='${c}';view()">${c}</button>`).join("")}<input placeholder="Search SKU or name…" value="${esc(pq)}" oninput="pq=this.value;clearTimeout(pt);pt=setTimeout(()=>{view();const e=document.querySelector('.chips input');e.focus();e.setSelectionRange(99,99)},250)"></div>
 <div class="box wrap">${L.length?`<table><tr><th>Part name</th><th>SKU</th><th>Category</th><th>Qty</th><th>Unit price</th><th>Status</th><th></th></tr>${L.map(p=>`<tr class="${low(p)?"low":""}"><td><b>${esc(p.name)}</b></td><td style="color:#888">${esc(p.sku)}</td><td>${esc(p.cat)}</td><td ${low(p)?'style="color:var(--bd);font-weight:700"':""}>${p.stock}</td><td>${R(p.price)}</td><td><span class="pill ${low(p)?"sk":"s2"}">${low(p)?(p.stock==0?"Out":"Low"):"In Stock"}</span></td><td style="white-space:nowrap"><button class="btn sm s" onclick="partForm('${p.id}')">Edit</button> <button class="btn sm d" onclick="delP('${p.id}')">Delete</button></td></tr>`).join("")}</table>`:'<p style="padding:24px">No parts match. Try another category or search.</p>'}</div>
 <div class="two"><div class="dark"><small>Total inventory value</small><b>${R(val)}</b><span style="color:#aaa">${S.parts.reduce((a,p)=>a+p.stock,0)} items · ${new Set(S.parts.map(p=>p.cat)).size} categories</span></div><div class="cr" style="margin:0"><small style="letter-spacing:1.4px;font-weight:700">LOW STOCK ACTION</small><p>${w?`${esc(w.name)}: only ${w.stock} left. Reorder threshold: ${w.re}.`:"Everything is well stocked. Nothing to reorder."}</p>${w?`<button class="btn k" onclick="toast('Reorder note saved for ${esc(w.name)}. Please place the order with your supplier.','o')">Reorder Now</button>`:""}</div></div>`}
let pt;
function partForm(id){const p=P(id)||{name:"",sku:"",cat:"",price:"",stock:"",re:5};modal(`<h3>${id?"Edit part":"Add a part"}</h3><div id="ferr"></div><label class="l">Part name *</label><input id="g1" value="${esc(p.name)}"><label class="l">SKU</label><input id="g5" value="${esc(p.sku)}"><label class="l">Category *</label><input id="g6" value="${esc(p.cat)}" placeholder="Brakes, Filters, Cables…"><label class="l">Price (Rand) *</label><input id="g2" type="number" min="0" step="0.01" value="${p.price}"><label class="l">Stock on hand *</label><input id="g3" type="number" min="0" value="${p.stock}"><label class="l">Warn me when stock drops to</label><input id="g4" type="number" min="0" value="${p.re}"><div style="display:flex;gap:10px;margin-top:18px"><button class="btn" onclick="saveP('${id||""}')">Save part</button><button class="btn s" onclick="modal()">Cancel</button></div>`)}
function saveP(id){const d={name:g1.value.trim(),sku:g5.value.trim(),cat:g6.value.trim(),price:parseFloat(g2.value),stock:parseInt(g3.value),re:parseInt(g4.value)||0};if(!d.name||!d.cat||!(d.price>=0)||!(d.stock>=0)){ferr.innerHTML=ban("Please add a name, category, price and stock number (0 or more).","e");return}
 id?Object.assign(P(id),d):S.parts.push({id:"P"+Date.now(),...d});save();modal();msg=`Done. ${d.name} saved.`;view()}
function delP(id){if(S.jobs.some(j=>j.parts.some(p=>p.pid==id))){toast("That part is used on a job, so it has to stay. Set its stock to 0 instead.","e");return}modal(`<h3>Delete this part?</h3><p>It will be removed from the catalogue for good.</p><div style="display:flex;gap:10px"><button class="btn d" onclick="S.parts=S.parts.filter(x=>x.id!='${id}');save();modal();msg='Part deleted.';view()">Yes, delete it</button><button class="btn k" onclick="modal()">Keep it</button></div>`)}
function invV(){const L=S.jobs.filter(ready);return`<h2>Invoices</h2><p class="sub">Invoices appear here once every safety check on a job has passed.</p><div class="box wrap">${L.length?`<table><tr><th>Invoice</th><th>Customer</th><th>Vehicle</th><th>Status</th><th class="n">Total due</th><th></th></tr>${L.map(j=>`<tr><td><b>${inv(j)}</b></td><td>${esc(j.cust)}</td><td>${esc(j.mk)}</td><td>${pill(j)}</td><td class="n">${R(tc(j))}</td><td><button class="btn sm k" onclick="invoice('${j.id}')">View invoice</button></td></tr>`).join("")}</table>`:'<p style="padding:24px">No invoices yet. Once a mechanic finishes all the safety checks, the invoice shows up here.</p>'}</div>`}
function invoice(id){const j=J(id);modal(`<div class="noprint">${ban("<b>Great news:</b> this job is complete, every safety check passed and all parts are accounted for.","o")}</div><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><h3 style="font-size:24px">Invoice ${inv(j)}</h3><span class="hint">${esc(j.cust)} · ${esc(j.mk)} · ${esc(j.reg)} · ${new Date().toISOString().slice(0,10)}</span></div><div class="noprint" style="display:flex;gap:8px"><button class="btn s" onclick="print()">Export PDF</button><button class="btn" onclick="csv('${id}')">Export CSV</button></div></div>
 <div class="cr" style="margin-top:16px;padding:6px 0"><table><tr><th style="background:#fde6c0">Part</th><th class="n" style="background:#fde6c0">Qty / hrs</th><th class="n" style="background:#fde6c0">Rate</th><th class="n" style="background:#fde6c0">Amount</th></tr><tr><td>Labour</td><td class="n">${j.hrs}</td><td class="n">${R(S.rate)}</td><td class="n">${R(lc(j))}</td></tr>${j.parts.map(p=>`<tr><td>${esc(P(p.pid).name)}</td><td class="n">${p.q}</td><td class="n">${R(p.pr)}</td><td class="n">${R(p.q*p.pr)}</td></tr>`).join("")}<tr><td></td><td></td><td class="n">Labour</td><td class="n">${R(lc(j))}</td></tr><tr><td></td><td></td><td class="n">Parts</td><td class="n">${R(pc(j))}</td></tr><tr><td></td><td></td><td class="n"><b>Total due</b></td><td class="n"><b style="font-size:20px">${R(tc(j))}</b></td></tr></table></div><button class="btn s noprint" onclick="modal()">Back</button>`)}
function csv(id){const j=J(id),r=[["Part","Qty/hrs","Rate","Amount"],["Labour",j.hrs,S.rate,lc(j)],...j.parts.map(p=>[P(p.pid).name,p.q,p.pr,p.q*p.pr]),["Total due","","",tc(j)]];
 try{const b=new Blob([r.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=inv(j)+".csv";a.click();toast("Your CSV is downloading.")}catch(e){toast("The download didn't start. Please try Export PDF instead.","e")}}
function repV(){const c=ST.map((s,i)=>S.jobs.filter(j=>j.st==i).length),mx=Math.max(1,...c),lw=S.parts.filter(low);
 return`<h2>Management Reports</h2><p class="sub">How the workshop is doing this week.</p><div class="two" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><div class="dark"><small>Total jobs</small><b>${S.jobs.length}</b></div><div class="cr" style="margin:0"><small>OPEN JOBS</small><b style="display:block;font-size:32px">${S.jobs.filter(j=>j.st<2).length}</b></div><div class="cr" style="margin:0"><small>READY FOR COLLECTION</small><b style="display:block;font-size:32px">${R(S.jobs.filter(j=>j.st==2).reduce((a,j)=>a+tc(j),0))}</b></div><div class="cr" style="margin:0"><small>LOW STOCK</small><b style="display:block;font-size:32px">${lw.length}</b></div></div>
 <div class="box" style="padding:20px;margin-top:16px"><b>Weekly repairs by status</b><div style="display:flex;align-items:flex-end;gap:16px;height:130px;margin-top:14px;border-bottom:1px solid var(--ln)">${c.map((n,i)=>`<div style="flex:1;height:${Math.max(n/mx*100,5)}%;background:${["var(--ot)","#000","#65d6a1"][i]};border-radius:12px 12px 0 0;text-align:center;font-weight:700;padding-top:4px">${n}</div>`).join("")}</div><div style="display:flex;gap:16px;margin-top:6px">${ST.map(s=>`<span class="hint" style="flex:1;text-align:center">${s}</span>`).join("")}</div></div>
 <div class="two"><div class="box" style="padding:20px"><b>Low stock alert</b>${lw.length?`<ul>${lw.map(p=>`<li>${esc(p.name)}: ${p.stock} left (reorder at ${p.re})</li>`).join("")}</ul>`:"<p>All parts are well stocked 🎉</p>"}</div><div class="box" style="padding:20px"><b>Mechanic workload</b><ul>${mechs().map(m=>`<li>${esc(m.n)}: ${act(m.u)} active job${act(m.u)==1?"":"s"}</li>`).join("")}</ul></div></div>
 <button class="btn d" onclick="if(confirm('Reset all test data back to the starting examples?')){S=seed();save();msg='Test data reset. Fresh start!';view()}">Reset test data</button>`}
view();
</script></body></html>
